time:
  interval_s: 60
  steps_per_run: 360          # 6 simulated hours per run
  warmup_steps: 30
  decision_every: 1
cluster:
  hosts: 30                   # one host per possible VM
  host_pes: 1
  host_mips: 1000
  vm_pes: 1
  vm_mips: 1000
  vm_min: 1
  vm_max: 30
  initial_vms: 4
  vm_startup_delay_s: 30      # boot time before a new VM can serve
requests:
  mean_service_s: 0.04        # 40 ms of CPU per request -> mu = 25 req/s per VM
  length_dist: exponential
  request_kb: 8               # for the network-in metric
  capacity_scale: 1.0         # Step 3.1 "Run time": a 360-step run took 7.7 min (< ~10 min), so no scaling (Step 3.13)
balancer: least_outstanding   # or round_robin
slo: {rt_ms: 250.0, delta: 0.05, z: 1.6448536269514722, use_conformal: false}   # rt_ms is unscaled; effective SLO = rt_ms / capacity_scale
actions: {k_min: -7, k_max: 7}
cost: {price_per_vm_hour: 0.10}
power: {model: square, p_idle_w: 80.0, p_max_w: 400.0}
bridge: {host: 127.0.0.1, port: 5555, timeout_s: 120}
engine:
  min_time_between_events: 0.0001  # Step 3.3 asks for at least 1 ms; 1 ms biased the M/M/1 check by +6%, 0.1 ms passes
  mips_scale: 1000                 # work counted in 1/1000 MI units: CloudSim Plus truncates processed work to whole units
telemetry:
  mem_util: {offset: 30.0, slope: 45.0, noise_std: 2.0}   # modelling assumption (Step 3.7)
random_target: {u_min: 0.3, u_max: 1.1, hold_intervals: 2}   # Step 3.14
calibration_runs:
  workloads: [random_walk, daily_ramp_burst]   # x calibration_seeds 1001..1010 = 20 runs
transitions: {after_offset: 2, rate_drift_flag: 0.15}   # Step 3.14
splits: {train: 0.6, calib: 0.2, test: 0.2, seed: 11}
counterfactual: {pairs: 50, ks: [-3, -2, -1, 0, 1, 2, 3], seed: 3100, min_step: 40,
                 holdout_seeds: [2001, 2002, 2003, 2004, 2005], workload: random_walk}
# Stage-2 training overrides for the CloudSim Plus models (merged over prototype.yaml's ensemble section).
# At max_epochs 300 every member stopped at the cap, before early stopping (patience 20) could act, and the
# variance heads were under-trained (aleatoric sigma 0.17 where the residual spread is 0.02 at low load).
ensemble: {max_epochs: 2000}
