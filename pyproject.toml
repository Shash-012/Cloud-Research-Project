[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscale"
version = "1.0.0"
description = "Reproduction of Pintye et al. (2024) ML-based autoscaling (OPT) in a simulated cloud"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy", "scikit-learn", "tabulate", "torch", "simpy", "matplotlib", "seaborn", "pyyaml", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
